# Gitleaks config for marfago-labs.github.io (CI + pre-commit).
# https://github.com/gitleaks/gitleaks

title = "marfago-labs.github.io"

[extend]
useDefault = true

[allowlist]
description = "Docs, placeholders, and public Search Console HTML-tag token"
paths = [
  '''(?:^|/)\.env\.example$''',
  '''(?:^|/)docs/''',
]
regexes = [
  # Public by design: Google Search Console HTML meta verification.
  '''sJg7T8DTZ-L-b2r4jbEYMCuKVZ6_Cd311AdeAy-5qQ8''',
]
