  <text x="200" y="376" fill="#1a1a18" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">feed-home.spec.ts, feed-nav.spec.ts</text>
  <line x1="72" y1="390" x2="328" y2="390" stroke="#0d4f4f" stroke-width="1.5" stroke-opacity="0.45"/>
