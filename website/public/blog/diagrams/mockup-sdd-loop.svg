<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="msl-title msl-desc">
  <title id="msl-title">Mockup to SDD to test loop</title>
  <desc id="msl-desc">Mockup region maps to SDD section, acceptance checkbox, and automated test.</desc>

  <rect width="400" height="420" fill="#faf8f4"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5a54"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d4f4f"/>
    </marker>
  </defs>

  <path fill="none" stroke="#0d4f4f" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-accent)" d="M 200 98 V 118"/>
  <path fill="none" stroke="#5c5a54" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)" d="M 200 204 V 224"/>
  <path fill="none" stroke="#0d4f4f" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-accent)" d="M 200 310 V 330"/>

  <rect x="50" y="16" width="300" height="82" rx="10" fill="#fffef9" stroke="#c8c2b6" stroke-width="1.5"/>
  <text x="200" y="42" fill="#0d4f4f" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Mockup region</text>
  <text x="200" y="62" fill="#1a1a18" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">feed-desktop.html  wall strip, cards</text>
  <line x1="72" y1="76" x2="328" y2="76" stroke="#a8a298" stroke-width="1.5"/>
  <text x="200" y="90" fill="#5c5a54" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Walk the layout</text>

  <rect x="50" y="118" width="300" height="86" rx="10" fill="#d4ede8" stroke="#0d4f4f" stroke-width="2"/>
  <text x="200" y="146" fill="#0d4f4f" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">SDD section</text>
  <text x="200" y="166" fill="#1a1a18" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">feed-and-home-ux.md �4, �7</text>
  <line x1="72" y1="180" x2="328" y2="180" stroke="#0d4f4f" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="200" y="194" fill="#5c5a54" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Requirements + acceptance</text>

  <rect x="50" y="224" width="300" height="86" rx="10" fill="#fffef9" stroke="#c8c2b6" stroke-width="1.5"/>
  <text x="200" y="252" fill="#0d4f4f" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">Acceptance checkbox</text>
  <text x="200" y="272" fill="#1a1a18" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="central">/ renders feed; wall context � search</text>
  <line x1="72" y1="286" x2="328" y2="286" stroke="#a8a298" stroke-width="1.5"/>
  <text x="200" y="300" fill="#5c5a54" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">What done means</text>

